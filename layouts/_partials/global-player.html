{{/* Global audio engine — audio element + smcgPlayer API. No sticky bar. */}}
<audio id="smcg-audio" preload="metadata" style="display:none;"></audio>

<script>
(function() {
  var audio = document.getElementById("smcg-audio");

  var s = {
    episode:  null,
    subtitle: null,
    pathname: null
  };

  function fire() {
    document.dispatchEvent(new CustomEvent("smcg:state", {
      detail: { episode: s.episode, playing: !audio.paused, time: audio.currentTime }
    }));
  }

  audio.addEventListener("play",       function() { fire(); });
  audio.addEventListener("pause",      function() { fire(); });
  audio.addEventListener("timeupdate", function() { fire(); });

  audio.addEventListener("ended", function() {
    if (s.pathname) {
      localStorage.setItem("smcg_played_" + s.pathname, "true");
      localStorage.removeItem("smcg_resume_" + s.pathname);
    }
    fire();
  });

  setInterval(function() {
    if (!audio.paused && !audio.ended && audio.currentTime > 0 && s.pathname)
      localStorage.setItem("smcg_resume_" + s.pathname, Math.floor(audio.currentTime));
  }, 5000);

  window.smcgPlayer = {
    load: function(episodeUrl, ep, subtitle, pathname, seekSecs) {
      s.pathname = pathname;
      if (s.episode === episodeUrl) {
        if (audio.paused) audio.play(); else audio.pause();
        return;
      }
      s.episode  = episodeUrl;
      s.subtitle = subtitle;
      audio.src  = episodeUrl;
      audio.load();
      if (seekSecs > 0) {
        audio.addEventListener("loadedmetadata", function() {
          audio.currentTime = seekSecs;
          audio.play();
        }, { once: true });
      } else {
        audio.play();
      }
    },

    seekTo: function(seconds, episodeUrl, ep, subtitle, pathname) {
      s.pathname = pathname;
      if (s.episode === episodeUrl) {
        audio.currentTime = seconds;
        audio.play();
      } else {
        s.episode  = episodeUrl;
        s.subtitle = subtitle;
        audio.src  = episodeUrl;
        audio.load();
        audio.addEventListener("loadedmetadata", function() {
          audio.currentTime = seconds;
          audio.play();
        }, { once: true });
      }
    },

    getState: function() {
      return { episode: s.episode, playing: !audio.paused, time: audio.currentTime, playedIntro: true };
    }
  };

})();
</script>
