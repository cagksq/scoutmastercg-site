{{/* Global persistent audio player — marked data-turbo-permanent so it survives page navigation */}}
<div id="smcg-global" data-turbo-permanent style="display:none;">

  <audio id="smcg-audio" preload="metadata" data-phase="intro" style="display:none;"></audio>

  <div class="smcg-sticky-inner">
    <div class="smcg-sticky-transport">
      <button class="smcg-sticky-skip" id="smcg-g-rew" title="Back 15 seconds">
        <span class="smcg-skip-wrap">
          <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
          <span class="smcg-skip-num">15</span>
        </span>
      </button>
      <button class="smcg-sticky-play" id="smcg-g-play" aria-label="Play/Pause">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="smcg-sticky-skip" id="smcg-g-fwd" title="Forward 15 seconds">
        <span class="smcg-skip-wrap">
          <svg viewBox="0 0 24 24"><path d="M18 13c0 3.31-2.69 6-6 6s-6-2.69-6-6 2.69-6 6-6v4l5-5-5-5v4c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8h-2z"/></svg>
          <span class="smcg-skip-num">15</span>
        </span>
      </button>
    </div>

    <div class="smcg-sticky-info">
      <span class="smcg-sticky-ep" id="smcg-g-ep"></span>
      <span class="smcg-sticky-div" id="smcg-g-div" style="display:none;">/</span>
      <span class="smcg-sticky-phase" id="smcg-g-phase">INTRO</span>
    </div>

    <div class="smcg-sticky-times">
      <span id="smcg-g-time">0:00</span><span class="smcg-sticky-div"> / </span><span id="smcg-g-rem">–:––</span>
    </div>

    <div class="smcg-speeds" id="smcg-g-speeds">
      <button class="smcg-spd" data-rate="0.75">.75×</button>
      <button class="smcg-spd on" data-rate="1">1×</button>
      <button class="smcg-spd" data-rate="1.25">1.25×</button>
      <button class="smcg-spd" data-rate="1.5">1.5×</button>
      <button class="smcg-spd" data-rate="2">2×</button>
    </div>
  </div>

  <div class="smcg-sticky-track" id="smcg-g-track">
    <div class="smcg-sticky-fill" id="smcg-g-fill"></div>
  </div>

</div>

<script>
(function() {
  var INTRO = "https://scoutmastercg-podcast.s3.us-east-005.backblazeb2.com/intro.mp3";

  var bar     = document.getElementById("smcg-global");
  var audio   = document.getElementById("smcg-audio");
  var btnPlay = document.getElementById("smcg-g-play");
  var btnRew  = document.getElementById("smcg-g-rew");
  var btnFwd  = document.getElementById("smcg-g-fwd");
  var elTime  = document.getElementById("smcg-g-time");
  var elRem   = document.getElementById("smcg-g-rem");
  var track   = document.getElementById("smcg-g-track");
  var fill    = document.getElementById("smcg-g-fill");
  var phasEl  = document.getElementById("smcg-g-phase");
  var epEl    = document.getElementById("smcg-g-ep");
  var divEl   = document.getElementById("smcg-g-div");
  var speeds  = document.querySelectorAll("#smcg-g-speeds .smcg-spd");

  var SVG_PLAY  = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  var SVG_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

  var s = {               // player state
    episode:      null,
    subtitle:     null,
    pathname:     null,
    playedIntro:  false,
    seekTarget:   0
  };

  function fmt(sec) {
    sec = Math.floor(sec || 0);
    return Math.floor(sec / 60) + ":" + (sec % 60 < 10 ? "0" : "") + sec % 60;
  }

  function fire() {
    document.dispatchEvent(new CustomEvent("smcg:state", {
      detail: { episode: s.episode, playing: !audio.paused, time: audio.currentTime }
    }));
  }

  function setIcon(playing) { btnPlay.innerHTML = playing ? SVG_PAUSE : SVG_PLAY; fire(); }

  function showBar() {
    if (bar.style.display === "block") return;
    bar.style.display = "block";
    document.body.style.paddingTop = "58px";
  }

  function setPhase(isEpisode) {
    audio.dataset.phase = isEpisode ? "episode" : "intro";
    phasEl.textContent  = isEpisode ? (s.subtitle || "EPISODE") : "INTRO";
  }

  function setEpLabel(ep) {
    if (ep) { epEl.textContent = "EP\u00a0" + ep; divEl.style.display = ""; }
    else    { epEl.textContent = "";              divEl.style.display = "none"; }
  }

  function switchToEpisode(seekSecs) {
    s.playedIntro = true;
    setPhase(true);
    audio.src = s.episode;
    audio.load();
    audio.addEventListener("loadedmetadata", function() {
      if (seekSecs > 0) audio.currentTime = seekSecs;
      audio.play();
    }, { once: true });
  }

  /* ── audio events ────────────────────────────────────── */
  audio.addEventListener("play",  function() { setIcon(true);  showBar(); });
  audio.addEventListener("pause", function() { setIcon(false); });

  audio.addEventListener("timeupdate", function() {
    if (!audio.duration) return;
    var pct = audio.currentTime / audio.duration * 100;
    fill.style.width   = pct + "%";
    elTime.textContent = fmt(audio.currentTime);
    if (s.playedIntro)
      elRem.textContent = "-" + fmt(Math.max(0, audio.duration - audio.currentTime));
    fire();
  });

  function onDuration() {
    if (audio.duration && isFinite(audio.duration))
      elRem.textContent = "-" + fmt(audio.duration);
  }
  audio.addEventListener("loadedmetadata", onDuration);
  audio.addEventListener("durationchange",  onDuration);

  audio.addEventListener("ended", function() {
    if (!s.playedIntro) {
      switchToEpisode(s.seekTarget);
    } else {
      setIcon(false);
      if (s.pathname) {
        localStorage.setItem("smcg_played_" + s.pathname, "true");
        localStorage.removeItem("smcg_resume_" + s.pathname);
      }
      fire();
    }
  });

  /* ── controls ────────────────────────────────────────── */
  btnPlay.addEventListener("click", function() { if (audio.paused) audio.play(); else audio.pause(); });

  btnRew.addEventListener("click", function() {
    if (s.playedIntro) audio.currentTime = Math.max(0, audio.currentTime - 15);
  });
  btnFwd.addEventListener("click", function() {
    if (s.playedIntro && audio.duration)
      audio.currentTime = Math.min(audio.duration, audio.currentTime + 15);
  });

  track.addEventListener("click", function(e) {
    if (!audio.duration) return;
    var r = track.getBoundingClientRect();
    audio.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * audio.duration;
  });

  speeds.forEach(function(btn) {
    btn.addEventListener("click", function() {
      speeds.forEach(function(b) { b.classList.remove("on"); });
      btn.classList.add("on");
      audio.playbackRate = parseFloat(btn.dataset.rate);
    });
  });

  setInterval(function() {
    if (s.playedIntro && !audio.paused && !audio.ended && audio.currentTime > 0 && s.pathname)
      localStorage.setItem("smcg_resume_" + s.pathname, Math.floor(audio.currentTime));
  }, 5000);

  /* ── public API ──────────────────────────────────────── */
  window.smcgPlayer = {
    load: function(episodeUrl, ep, subtitle, pathname, seekSecs) {
      // Same episode already in episode phase — just toggle play
      if (s.episode === episodeUrl && s.playedIntro) {
        if (audio.paused) audio.play(); else audio.pause();
        return;
      }
      s.episode     = episodeUrl;
      s.subtitle    = subtitle;
      s.pathname    = pathname;
      s.seekTarget  = seekSecs || 0;
      s.playedIntro = false;
      setEpLabel(ep);
      setPhase(false);
      audio.src = INTRO;
      audio.load();
      audio.play();
    },

    seekTo: function(seconds, episodeUrl, ep, subtitle, pathname) {
      if (s.episode === episodeUrl && s.playedIntro) {
        audio.currentTime = seconds;
        audio.play();
      } else {
        s.episode     = episodeUrl;
        s.subtitle    = subtitle;
        s.pathname    = pathname;
        s.seekTarget  = seconds;
        s.playedIntro = true;   // skip intro when jumping to timestamp
        setEpLabel(ep);
        showBar();
        setPhase(true);
        audio.src = episodeUrl;
        audio.load();
        audio.addEventListener("loadedmetadata", function() {
          audio.currentTime = seconds;
          audio.play();
        }, { once: true });
      }
    },

    getState: function() {
      return { episode: s.episode, playing: !audio.paused, time: audio.currentTime, playedIntro: s.playedIntro };
    }
  };

})();
</script>
