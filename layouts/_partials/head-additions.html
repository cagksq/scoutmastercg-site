<div id="smcg-share-overlay" hidden>
  <div id="smcg-share-modal">
    <button id="smcg-share-close">✕</button>
    <p id="smcg-share-title"></p>
    <div id="smcg-share-options">
      <button onclick="smcgShareCopy()">Copy link</button>
      <a id="smcg-share-email">Email</a>
      <button id="smcg-share-ts" hidden onclick="smcgShareTimestamp()">Share from here</button>
    </div>
    <span id="smcg-share-confirm" hidden>✓ Copied</span>
  </div>
</div>

<script>
window.smcgSort = function(dir, btn) {
  document.querySelectorAll('.topics-sort-btn').forEach(function(b) {
    b.classList.toggle('active', b === btn);
  });
  document.querySelectorAll('.topics-page-list').forEach(function(list) {
    var rows = Array.from(list.querySelectorAll('.topics-page-row'));
    rows.sort(function(a, b) {
      var av = a.dataset.sort || '';
      var bv = b.dataset.sort || '';
      return dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    });
    rows.forEach(function(r) { list.appendChild(r); });
  });
};

window.smcgOpenShare = function(url, title, hasTimestamp) {
  document.getElementById('smcg-share-title').textContent = title;
  var tsBtn = document.getElementById('smcg-share-ts');
  if (hasTimestamp) { tsBtn.removeAttribute('hidden'); } else { tsBtn.hidden = true; }
  window._smcgShareUrl = url;
  var emailLink = document.getElementById('smcg-share-email');
  emailLink.href = 'mailto:?subject=' + encodeURIComponent(title) + '&body=' + encodeURIComponent(url);
  document.getElementById('smcg-share-confirm').hidden = true;
  document.getElementById('smcg-share-overlay').removeAttribute('hidden');
};

window.smcgShareCopy = function() {
  navigator.clipboard.writeText(window._smcgShareUrl || window.location.href).then(function() {
    var el = document.getElementById('smcg-share-confirm');
    el.hidden = false;
    setTimeout(function() { el.hidden = true; }, 2000);
  });
};

window.smcgShareTimestamp = function() {
  if (typeof copyTimestampLink === 'function') { copyTimestampLink(); }
  var el = document.getElementById('smcg-share-confirm');
  el.hidden = false;
  setTimeout(function() { el.hidden = true; }, 2000);
};

document.addEventListener('DOMContentLoaded', function() {
  var closeBtn = document.getElementById('smcg-share-close');
  var overlay = document.getElementById('smcg-share-overlay');
  if (closeBtn) closeBtn.addEventListener('click', function() { overlay.setAttribute('hidden', ''); });
  if (overlay) overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.setAttribute('hidden', '');
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay && !overlay.hasAttribute('hidden')) {
      overlay.setAttribute('hidden', '');
    }
  });
});
</script>
