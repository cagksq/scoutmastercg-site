{{ define "main" }}
  <div class="pt2 pa3 pa4-ns center mw8">
    <h1 style="font-family:'Playfair Display',serif; font-size:2.25rem; font-weight:700; color:#3B4D1E; text-align:center; margin:1.5rem 0 0.5rem;">{{ .Title | humanize | title }}</h1>
    <p style="font-family:'Roboto',sans-serif; font-size:0.75rem; letter-spacing:0.12em; text-transform:uppercase; color:#aaa; text-align:center; margin:0 0 2rem;">{{ len .Pages }} posts</p>
    {{ with .Content }}
    <p style="font-family:'Roboto',sans-serif; font-size:1.05rem; color:#444; line-height:1.7; max-width:42rem; margin-bottom:2rem; border-left:3px solid #3B4D1E; padding-left:1rem;">{{ . }}</p>
    {{ end }}
    <table style="width:100%; border-collapse:collapse;">
      {{ range .Pages.ByDate }}
        <tr style="border-bottom: 1px solid #e0e0e0;">
          <td style="padding: 10px 8px; vertical-align:top; width:100px; text-align:right;">
            <span style="font-size:0.65rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:#888;">
              {{ .Date.Format "Jan 2006" }}
            </span>
          </td>
          <td style="padding: 10px 12px; vertical-align:top;">
            <a href="{{ .RelPermalink }}" style="text-decoration:none; color:inherit;">
              <strong style="font-size:1rem; color:#222;">{{ .Title }}</strong>
            </a>
            <div style="font-family:'Source Serif 4',Georgia,serif; font-size:0.85rem; color:#777; line-height:1.5; margin-top:3px;">{{ .Summary | truncate 120 }}</div>
          </td>
        </tr>
      {{ end }}
    </table>
  </div>
{{ end }}
