{{ define "main" }}
  <div class="mw8 center ph3 ph4-ns pt4">
    {{ range .Data.Pages.ByTitle }}
      {{ $desc := index $.Site.Data.category_descriptions .LinkTitle }}
      <div class="mb5">
        <h2 class="f2 fw7 mb1" style="line-height:1.2;">
          <a href="{{ .RelPermalink }}" style="text-decoration:none; color:#222;">
            {{ strings.Replace .LinkTitle "-" " " | title }}
          </a>
        </h2>
        {{ if $desc }}
          <p class="f5 i mid-gray mt1 mb0" style="max-width:42em;">{{ $desc }}</p>
        {{ end }}
      </div>
    {{ end }}
  </div>
{{ end }}
