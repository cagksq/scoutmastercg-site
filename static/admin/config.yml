backend:
  name: git-gateway
  branch: main

media_folder: static/images
public_folder: /images

collections:
  - name: "posts"
    label: "Posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    preview_path: "posts/{{slug}}"
    summary: "{{date}} — {{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Draft", name: "draft", widget: "hidden", default: false }
      - label: "Categories"
        name: "categories"
        widget: "list"
        hint: "Type category slugs, e.g: outdoors, patrol-method, scoutmasters-job — see Settings › Categories for the full list"
        field: { label: "Category", name: "category", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "podcasts"
    label: "Podcasts"
    folder: "content/podcasts"
    create: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Episode", name: "episode", widget: "number" }
      - { label: "Draft", name: "draft", widget: "hidden", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Settings"
    files:
      - name: "categories"
        label: "Categories"
        file: "data/categories.yaml"
        fields:
          - name: "categories"
            label: "Categories"
            widget: "list"
            fields:
              - { label: "Name", name: "label", widget: "string" }
              - { label: "Slug (used in posts)", name: "value", widget: "string" }
