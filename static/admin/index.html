<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScoutmasterCG — Content Manager</title>
</head>
<body>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <!-- Return-to-post dialog -->
  <div id="publish-dialog" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:6px; padding:2rem 2.5rem; max-width:360px; width:90%; text-align:center; font-family:sans-serif; box-shadow:0 8px 32px rgba(0,0,0,0.2);">
      <p style="font-size:1.1rem; margin:0 0 1.5rem; color:#333; line-height:1.5;">Post saved. Do you want to return to the site?</p>
      <div style="display:flex; gap:1rem; justify-content:center;">
        <a id="publish-dialog-yes" href="#" target="_blank"
           style="background:#3B4D1E; color:#fff; text-decoration:none; padding:0.6rem 1.5rem; border-radius:4px; font-weight:600; font-size:1rem;">
          View Post
        </a>
        <button onclick="document.getElementById('publish-dialog').style.display='none';"
                style="background:none; border:1px solid #ccc; color:#666; padding:0.6rem 1.5rem; border-radius:4px; font-size:1rem; cursor:pointer;">
          Stay
        </button>
      </div>
    </div>
  </div>

  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }

    window.addEventListener("load", function() {
      var collectionPaths = { posts: "/posts/", podcasts: "/podcasts/" };
      CMS.registerEventListener({
        name: "postSave",
        handler: function(entry) {
          var collection = entry.entry.get("collection");
          var slug = entry.entry.get("slug");
          var base = collectionPaths[collection] || "/";
          var url = base + slug + "/";
          var dialog = document.getElementById("publish-dialog");
          document.getElementById("publish-dialog-yes").href = url;
          dialog.style.display = "flex";
        }
      });
    });
  </script>
</body>
</html>
